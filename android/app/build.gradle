plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.letuluvme.vocabexpedition'
    compileSdk 35

    defaultConfig {
        applicationId 'com.letuluvme.vocabexpedition'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resConfigs 'zh', 'en'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 这个壳没有任何需要裁剪的代码，关掉 R8 换来更可预期的构建。
            minifyEnabled false
            shrinkResources false
            // keystore.properties 缺失时退回 debug 签名，保证构建不因此失败。
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
